services:
  anylog-standalone-operator-init:
    image: busybox
    user: root
    restart: "no"
    command: [
      "sh", "-c",
      "chown -R 10001:10001 
        /app/AnyLog-Network/anylog 
        /app/AnyLog-Network/blockchain 
        /app/AnyLog-Network/data 
        /app/deployment-scripts
      "
    ]
    volumes:
      - anylog-standalone-operator-anylog:/app/AnyLog-Network/anylog
      - anylog-standalone-operator-blockchain:/app/AnyLog-Network/blockchain
      - anylog-standalone-operator-data:/app/AnyLog-Network/data
      - anylog-standalone-operator-local-scripts:/app/deployment-scripts
  anylog-standalone-operator:
    image: anylogco/anylog-network:1.4.2603-152c10
    user: "anylog:anylog"
    platform: linux/amd64
    restart: always
    env_file:
      - ../../docker-makefiles/anylog-standalone-operator/node_configs.env
    container_name: anylog-standalone-operator
    stdin_open: true
    tty: true
    network_mode: host
    depends_on:
      anylog-standalone-operator-init:
        condition: service_completed_successfully
    volumes:
      - anylog-standalone-operator-anylog:/app/AnyLog-Network/anylog
      - anylog-standalone-operator-blockchain:/app/AnyLog-Network/blockchain
      - anylog-standalone-operator-data:/app/AnyLog-Network/data
      - anylog-standalone-operator-local-scripts:/app/deployment-scripts
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  anylog-standalone-operator-anylog:
  anylog-standalone-operator-blockchain:
  anylog-standalone-operator-data:
  anylog-standalone-operator-local-scripts:
